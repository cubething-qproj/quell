[package]
name = "quell"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cubething-qproj/quell"

[lints]
clippy.too_many_arguments = "allow"
clippy.type_complexity = "allow"
clippy.nonstandard_macro_braces = "warn"

[dependencies]
bevy = "0.19"
bevy_enhanced_input = "0.26"
bevy_asset_loader = "0.27"
avian3d = "0.7"
# Loads Jackdaw-authored `.bsn` scenes, answers the editor's schema query and
# connects Play-in-editor. 0.19 is git-only; keep `rev` matching the installed editor.
jackdaw_runtime = { git = "https://github.com/ada-x64/jackdaw", branch="main", features = ["physics"] }

# not bevy
tiny_bail = "0.7"
bitflags = "2.9.3"

q_screens = { git = "https://github.com/cubething-qproj/q_screens", version = "^0.2.0", features = ["bevy_picking", "bevy_gilrs"] }
q_cam = { git = "https://github.com/cubething-qproj/q_cam", version = "^0.1.0" }

# dev
clap = { optional = true, version = "4.5.54", features = ["derive"] }
q_shell = { optional = true, git = "https://github.com/cubething-qproj/q_shell", version = "^0.1.0" }
bevy-inspector-egui = { optional = true, version = "0.37.0" }

[dev-dependencies]
q_test_harness = { git = "https://github.com/cubething-qproj/q_test_harness", version = "^0.1" }

[build-dependencies]
built = { optional = true, version = "0.8.0", features = ["chrono"] }

[features]
# Default so the Jackdaw editor, which builds without feature selection, gets dev tooling.
default = ["dev", "dylib", "jackdaw"]
dev = [
    "dep:clap",
    "dep:q_shell",
    "dep:bevy-inspector-egui",
    "dep:built",
    "q_cam/free_camera",
]
dylib = ["bevy/dynamic_linking"]
jackdaw = ["jackdaw_runtime/pie"]
